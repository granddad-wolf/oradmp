[package]
name = "oradmp-core"
description = "Reader for legacy Oracle exp dump files (core, no Python)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
thiserror = "2"
sha2 = "0.10"
arrow-buffer = "59"
arrow-array = "59"
arrow-schema = "59"
encoding_rs = "0.8"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12.0"

[[bench]]
name = "decode"
harness = false
