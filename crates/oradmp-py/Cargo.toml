[package]
name = "oradmp-py"
description = "Python binding of oradmp-core (PyO3, maturin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
oradmp-core = { path = "../oradmp-core" }
pyo3 = { version = "0.30", features = ["abi3-py311", "extension-module"] }
pyo3-arrow = "0.20"
arrow-array = "59"
arrow-schema = "59"

[features]
# adds `_core._probe_panic` for tests/test_internal.py; never in a release build (ADR-59 item 5, check_dist.py)
test-probes = []

[lints]
workspace = true
