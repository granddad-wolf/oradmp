[workspace]
resolver = "2"
members = ["crates/oradmp-core", "crates/oradmp-py"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Lints of architecture 7.3: input is hostile, never a panic. Tests allow them at the top of the file.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic = "deny"
